name: approve
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr review "$PR" --approve -R "$GITHUB_REPOSITORY" --body "bot approval"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
